<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e2e8f0;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
      }
      .on { background: #14532d; color: #86efac; }
      .off { background: #7f1d1d; color: #fca5a5; }
      p { font-size: 12px; color: #94a3b8; line-height: 1.5; }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        background: #1e293b;
        color: #e2e8f0;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover { background: #334155; }
    </style>
  </head>
  <body>
    <h1>ClearPath Blocker</h1>
    <div id="status" class="badge off">checking…</div>
    <p id="detail"></p>
    <button id="resume" hidden>Resume protection now</button>
    <button id="options">Settings &amp; lock</button>
    <script src="popup.js"></script>
  </body>
</html>
